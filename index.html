<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Régua Barsi 11% Auto v7.8</title>
<style>
:root{ --bg:#070b12; --bg2:#0b1220; --card:#111a29; --card2:#0f172a; --line:#1e2a3f; --txt:#e6f0ff; --muted:#8a9bb3; --accent:#8b5cf6; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --shadow:0 10px 30px rgba(0,0,0,.35);}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:radial-gradient(1200px 800px at 80% -20%, #1e1b4b 0%, transparent 60%),radial-gradient(1000px 600px at -10% 0%, #0e7490 0%, transparent 50%),linear-gradient(180deg, var(--bg), var(--bg2));color:var(--txt);}
header{position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);background:linear-gradient(180deg, rgba(7,11,18,.85), rgba(7,11,18,.6));border-bottom:1px solid var(--line);}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.head{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.logo{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 210deg, #7c3aed, #06b6d4, #7c3aed);}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 0 4px;width:100%;}
.left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(17,26,41,.6);color:var(--muted);font-size:12px;}
.btn{appearance:none;border:1px solid #2a3752;background:#162135;color:#dbe7ff;padding:12px 14px;border-radius:14px;font-weight:600;font-size:14px;cursor:pointer;}
.btn.primary{background:linear-gradient(135deg, var(--accent), #4f46e5);border-color:transparent;color:white;}
.btn.ghost{background:transparent}
.btn.small{padding:8px 10px;font-size:12px;border-radius:10px}
main.grid{display:grid;gap:16px;grid-template-columns:repeat(4,1fr);padding:16px 0 40px;}
@media (max-width:1100px){main.grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:680px){main.grid{grid-template-columns:1fr;}}
.card{background:linear-gradient(180deg, #0f1828, #0c1422);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.ticker{font-size:22px;font-weight:800;}
.badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#0b1424;color:#bcd1ff;}
.badge.ok{background:rgba(16,185,129,.12);color:#7ff0c6;border-color:rgba(16,185,129,.3)}
.badge.warn{background:rgba(245,158,11,.12);color:#ffd38a;border-color:rgba(245,158,11,.3)}
.badge.bad{background:rgba(239,68,68,.12);color:#ffb4b4;border-color:rgba(239,68,68,.3)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}
.metric{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px;}
.metric label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.metric.val{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:18px;font-weight:700;}
.iconbtn{border:1px solid var(--line);background:#0b1424;color:#bcd1ff;padding:6px 8px;border-radius:10px;font-size:12px;cursor:pointer;}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.level{text-align:center;padding:10px 8px;border-radius:14px;background:#0a1322;border:1px solid var(--line);color:#9ab0d0;font-size:12px;opacity:.55}
.level.active{opacity:1;border-color:#5b4bf5;box-shadow:0 0 0 1px rgba(91,75,245,.5) inset;color:#e9e7ff;}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:11px;color:var(--muted);}
.hint{margin-top:8px;font-size:12px;color:#a6b8d6;background:#0a1322;border:1px dashed var(--line);padding:10px 12px;border-radius:12px;}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding:24px 0 60px;text-align:center;}
.manual{color:#93c5fd;font-size:11px;margin-left:6px}
.thermo{margin-top:12px}
.thermo-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.thermo-track{position:relative;height:10px;border-radius:999px;background:#0a1322;border:1px solid var(--line);overflow:hidden;}
.thermo-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg, #10b981, #f59e0b, #ef4444)}
.thermo-dot{position:absolute;top:-3px;width:2px;height:16px;background:rgba(255,255,255,.7);}
.thermo-pointer{position:absolute;top:-5px;width:4px;height:20px;background:#fff;border-radius:2px;box-shadow:0 0 8px rgba(0,0,0,.6);transform:translateX(-50%);z-index:2}
.thermo-scale{display:flex;justify-content:space-between;font-size:10px;color:#6b7f9e;margin-top:4px}
.exdate{color:#93c5fd}
.exdate.soon{color:#ffd38a;font-weight:700}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<header><div class="wrap">
  <div class="head"><div class="brand"><div class="logo"></div><div>
    <h1>Régua Barsi 11% Auto</h1>
    <div class="sub">ISAE4 • CMIG4 • BBSE3 • TAEE11 • ITSA4 • SAPR11 — Preço Teto = Dividendo 12m / 11%</div>
  </div></div></div>
  <div class="controls">
    <div class="left">
      <span id="lastUpdate" class="pill">Carregando…</span>
      <span class="pill">100% grátis • sem chave</span>
    </div>
    <div class="left">
      <button id="notifyBtn" class="btn small">Ativar Notificações</button>
      <button id="clearBtn" class="btn small ghost">Limpar Cache</button>
      <button id="updateBtn" class="btn primary">Atualizar Agora</button>
    </div>
  </div>
</div></header>
<main class="wrap">
  <div id="cards" class="grid"></div>
